<div style="margin:0;padding:32px 16px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#172033">
  <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden">
    <div style="padding:28px 32px;background:#14233d;color:#fff">
      <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b8d3ff">New Future Bank</p>
      <h1 style="margin:12px 0 0;font-size:25px;line-height:1.25">Reset your password</h1>
    </div>
    <div style="padding:28px 32px;line-height:1.6">
      <p style="margin:0 0 18px">We received a request to reset the password for your New Future Bank account. Use the button below, then choose a new password.</p>
      <p style="margin:24px 0;text-align:center">
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:13px 22px;border-radius:8px;background:#2457a7;color:#fff;font-weight:700;text-decoration:none">Choose a new password</a>
      </p>
      <p style="margin:20px 0 0;font-size:13px;color:#526174">If you did not request a password reset, ignore this message. Your password will not change.</p>
    </div>
  </div>
</div>
